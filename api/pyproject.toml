[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cricket-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
    # Pinned exactly (2026-09-28): these three decide a probability's last
    # bits. Golden parity (ingest/golden_parity.py) compares production with
    # api/data/golden/match_8429.json bit for bit, and that reference was
    # written with these versions; the daily Action and Railway both install
    # from here. An upgrade is a deliberate change: bump them together,
    # regenerate the reference, and say why.
    "numpy==2.4.6",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlglot>=25",
]

[project.optional-dependencies]
# httpx2 is what starlette.testclient imports; without it every test that
# builds a TestClient fails at COLLECTION, so the whole agent suite is
# unrunnable from a clean install. It was missing until 2026-09-21 and
# went unnoticed because the ambient system Python happened to carry the
# deprecated httpx - which is the drift a project venv exists to prevent.
dev = ["pytest>=8", "httpx2", "anthropic>=0.40"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["src"]

# agent_tools/views.sql is read at runtime by replica.py via
# Path(__file__).with_name(). Without this it is absent from the wheel -
# `pip wheel ./api` ships the three .py files and nothing else - so
# --bootstrap raises FileNotFoundError from an installed package while
# working perfectly from the editable local checkout. The Dockerfile does a
# real `pip install .`, not an editable one. Found by building the wheel and
# listing it, not by deploying and waiting.
[tool.setuptools.package-data]
agent_tools = ["*.sql"]
