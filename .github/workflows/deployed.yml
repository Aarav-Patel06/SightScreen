name: Deployed

# "Deployed" is checked, not assumed (SPEC.md section 15, 2026-09-27), and the
# check itself never gates a deploy (2026-09-28). Hourly, it asks each
# production service which commit it runs and compares that with the newest
# main commit whose push CI passed 20+ minutes ago; then it smoke-tests the
# agent's tool path without calling the model.
#
# It NEVER waits and ALWAYS succeeds. A pending or failed run is a check suite
# on main's head, and Railway's "Wait for CI" skips deploying a commit that has
# one - the first version, which waited up to 20 minutes after every CI run,
# deadlocked with it. A failure opens an "[ops]" issue instead (scripts/ops_alert.py).

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  deployed:
    runs-on: ubuntu-latest
    continue-on-error: true  # backstop: even a broken reporter must not fail the run
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # "a later commit on main" is an ancestry question
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "psycopg[binary]"
      - name: Every service runs main (as of 20 minutes ago) or later
        id: sha
        continue-on-error: true
        env:
          SUPABASE_SESSION_POOLER_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
        run: |
          set -o pipefail
          expect=$(python scripts/check_deployed.py settled --minutes 20)
          python scripts/check_deployed.py sha --expect "$expect" 2>&1 | tee "$RUNNER_TEMP/sha.txt"
      - name: Report deployment
        if: always()
        run: >-
          python scripts/ops_alert.py --title "Production is behind main"
          --failing ${{ steps.sha.outcome == 'failure' }}
          --details "$(tail -n 3 "$RUNNER_TEMP/sha.txt" 2>/dev/null)"
          --run-url "$RUN_URL"
      - name: Agent smoke check (no model call)
        id: smoke
        continue-on-error: true
        env:
          AGENT_TOOL_SHARED_SECRET: ${{ secrets.AGENT_TOOL_SHARED_SECRET }}
        run: |
          set -o pipefail
          python scripts/check_deployed.py smoke 2>&1 | tee "$RUNNER_TEMP/smoke.txt"
      - name: Report smoke check
        if: always()
        run: >-
          python scripts/ops_alert.py --title "Agent smoke check is failing"
          --failing ${{ steps.smoke.outcome == 'failure' }}
          --details "$(tail -n 3 "$RUNNER_TEMP/smoke.txt" 2>/dev/null)"
          --run-url "$RUN_URL"
