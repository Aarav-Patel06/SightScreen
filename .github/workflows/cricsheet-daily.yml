name: Cricsheet daily ingest

# Every newly released men's T20/ODI match on Cricsheet, loaded with the
# corpus loader, scored by the served model and logged as the BACKFILL
# cohort. See api/src/ingest/daily_cricsheet.py.
#
# The corpus is not here and never will be (SPEC.md section 2.1). The job
# rebuilds the as-of summaries from Supabase's feature_ledger inside the
# throwaway Postgres below, with the same code the corpus uses; the parity
# test in tests/ingest/test_daily_cricsheet.py proves the result identical.
#
# 02:00 UTC: before the calibration monitor (03:00), so tonight's matches are
# in tonight's report, and before the backup (04:00), so they are in it too.
#
# workflow_dispatch for the same reason calibration.yml has it, plus the
# catch-up: `bundle=all since=2026-08-24` ingests everything since the corpus
# ended. `drill_unreachable_source` points the download at a host that cannot
# resolve, to prove an unreachable Cricsheet turns the run red - a boolean
# rather than a free-text URL, so a dispatch cannot aim the job anywhere else.
#
# THE LOGS ARE PUBLIC (so is the repository). The job prints counts and
# timings only - see PUBLIC_KEYS and redact() in ingest/daily_cricsheet.py.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      bundle:
        description: "recently_added_30 (daily) or all (catch-up)"
        type: choice
        options: [recently_added_30, all]
        default: recently_added_30
      since:
        description: "ignore matches dated before this (YYYY-MM-DD), optional"
        required: false
      drill_unreachable_source:
        description: "failure drill: download from an unreachable host (must go red)"
        type: boolean
        default: false
      drill_golden_parity:
        description: "failure drill: alter one golden reference value (must go red)"
        type: boolean
        default: false

# Least privilege: the job reads the repository and nothing else. Supabase is
# reached with its own secret, and artifact upload uses the runtime token,
# not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    continue-on-error: true  # see the report job below
    outputs:
      ok: ${{ steps.done.outputs.ok }}
    # A cron run and a dispatch must never interleave: both hand out new
    # match, team and venue ids and replace the summaries.
    #
    # QUEUE, not cancel. Cancelling a run in progress stops it between
    # writes - recoverable (every write is idempotent and the ledger row is
    # written last) but it throws away a catch-up's work and leaves the
    # summaries a run behind until the next one. Queued, each run starts
    # from the state the previous one committed. GitHub keeps at most ONE
    # pending run per group, so a third arrival replaces the waiting one;
    # that loses nothing, because every run reads the same bundle and skips
    # what is already done.
    concurrency:
      group: cricsheet-daily
      cancel-in-progress: false
    services:
      stage:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stage
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STAGE_URL: postgresql://postgres:postgres@localhost:5433/stage?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install api package
        run: pip install -e "./api[dev]"
      - name: Apply migrations to the stage database
        run: npx supabase db push --db-url "$STAGE_URL"
      # Golden parity (ingest/golden_parity.py): match 8429 rebuilt from its
      # committed raw JSON and Supabase's feature_ledger, on the daily job's own
      # path, for every version in api/data/golden/match_8429.json - and
      # compared with that reference EXACTLY. Before the ingest, so a scoring
      # path that has drifted writes nothing. Its own database, because the
      # ingest needs an empty stage.
      - name: Create the golden-parity database
        env:
          GOLDEN_URL: postgresql://postgres:postgres@localhost:5433/golden?sslmode=disable
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -c "CREATE DATABASE golden"
          npx supabase db push --db-url "$GOLDEN_URL"
      - name: Golden parity
        working-directory: api/src
        env:
          SUPABASE_SESSION_POOLER_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOLDEN_URL: postgresql://postgres:postgres@localhost:5433/golden?sslmode=disable
          DRILL: ${{ inputs.drill_golden_parity || false }}
        run: |
          set -euo pipefail
          args=(check --stage-url "$GOLDEN_URL" --cache-dir "$RUNNER_TEMP/golden-models")
          if [ "$DRILL" = "true" ]; then args+=(--drill); fi
          python -u -m ingest.golden_parity "${args[@]}"
      - name: Ingest
        working-directory: api/src
        env:
          # SESSION pooler, port 5432 (SPEC.md section 2.4). Direct
          # connections are IPv6-only and unreachable from a runner.
          SUPABASE_SESSION_POOLER_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          # The raw-JSON store (ingest/raw_store.py): a private Storage
          # bucket, reached with the secret key. It reaches nothing the pooler
          # URL above does not already.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MODEL_CACHE_DIR: ${{ runner.temp }}/models
          BUNDLE: ${{ inputs.bundle || 'recently_added_30' }}
          SINCE: ${{ inputs.since }}
          DRILL: ${{ inputs.drill_unreachable_source || false }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SESSION_POOLER_URL" || {
            echo "SUPABASE_SESSION_POOLER_URL is not set"; exit 1; }
          args=(run --stage-url "$STAGE_URL" --bundle "$BUNDLE" --report "$RUNNER_TEMP/daily-report.json")
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
          # .invalid is reserved (RFC 2606) and never resolves.
          if [ "$DRILL" = "true" ]; then args+=(--bundle-url "https://cricsheet.invalid/recently_added_30_json.zip"); fi
          python -u -m ingest.daily_cricsheet "${args[@]}"
      - name: Keep the report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cricsheet-daily-report
          path: ${{ runner.temp }}/daily-report.json
          if-no-files-found: warn
      - name: Every step succeeded
        id: done
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

  # Only push-triggered CI may gate a deploy (SPEC.md section 15, 2026-09-28).
  # This scheduled/dispatched run attaches to main's head as a check suite, and
  # Railway's "Wait for CI" skips a commit with a failed one - so the work job
  # is continue-on-error (the run concludes success) and a failure is reported
  # as an "[ops]" issue instead. The steps themselves still stop at the first
  # failure: `ok` is set only by the last one.
  report:
    needs: ingest
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Open or close the ops issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ops_alert.py --title "Cricsheet daily ingest is failing"
          --failing ${{ needs.ingest.outputs.ok != 'true' }}
          --details "A step failed or did not finish; the run has the log."
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
