name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Kept in sync with docker-compose.yml's pin to Supabase's actual
        # Postgres version (see Phase 0 session 2) - not load-bearing for
        # CI itself, but avoids "works differently in CI than locally".
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cricket_training
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Placeholder values only, so config.py's fail-fast validation succeeds
      # in CI. Never real secrets - see api/.env.example for what these mean.
      # LOCAL_DATABASE_URL is NOT set here - it's derived from
      # api/src/db/defaults.py below, the single source of truth this app
      # and CI both import, so it can't drift from docker-compose.yml's
      # local dev value again (sslmode has broken this twice already).
      CRICSHEET_DATA_DIR: ./data/cricsheet
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install api package
        run: pip install -e "./api[dev]"
      - name: Set LOCAL_DATABASE_URL from api/src/db/defaults.py
        working-directory: api/src
        run: echo "LOCAL_DATABASE_URL=$(python -m db.defaults)" >> "$GITHUB_ENV"
      - name: Apply migrations to the CI postgres service
        run: npx supabase db push --db-url "$LOCAL_DATABASE_URL"
      - name: Run tests
        run: pytest tests
  # Its OWN job, as of Phase 2 session 5, and that is the whole point.
  # It used to be the last step of `api`, behind a 14-minute pytest run. It
  # fired correctly on two pushes in session 3, went unread, and then a test
  # failure in session 4a moved the red earlier - so for ten consecutive runs
  # this check was reported as `skipped` while the file drifted four
  # migrations out of date. A cheap check that can be masked by an expensive
  # one is a check you will eventually stop having.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check web/lib/types.ts is not stale
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # --project-id (not --linked, and not --db-url) deliberately:
          # --linked needs supabase/.temp/project-ref, which is gitignored
          # and doesn't exist in a fresh checkout. --db-url against a bare
          # Postgres (no PostgREST/GraphQL server behind it) omits the
          # __InternalSupabase/graphql_public block entirely, which would
          # make this diff fail on every run regardless of real drift -
          # confirmed empirically, not assumed. --project-id hits the same
          # Management API --linked does, with no local link state needed.
          npx supabase gen types typescript --project-id xrvgmjmvgmtepgryyulk > /tmp/types.ts
          diff web/lib/types.ts /tmp/types.ts || {
            echo "::error::web/lib/types.ts is stale - run 'npx supabase gen types typescript --linked > web/lib/types.ts' and commit it";
            exit 1;
          }

  # The agent eval's DETERMINISTIC half, plus a staleness gate on the half
  # that cannot run here. Its own job, not a step inside `api`, for the reason
  # the types check was extracted into one: on 2026-09-18 a different failure
  # earlier in the same job reported the staleness step as `skipped` for ten
  # consecutive runs while the drift it existed to catch grew unchecked.
  #
  # NO MODEL CALLS. The live eval costs money per run and is nondeterministic,
  # and a check that goes red intermittently teaches people to ignore red.
  # What CI enforces is that the paid half was RE-RUN against the current
  # prompt - not that it passed.
  agent-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e "./api[dev]"
      - name: Generated TypeScript is not stale
        working-directory: api/src
        run: |
          python -m agent_eval.prompt --emit-ts
          python -m agent_eval.tools --emit-ts
          git diff --exit-code -- ../../web/lib/agent-prompt.ts ../../web/lib/agent-tools.ts || {
            echo "::error::web/lib/agent-prompt.ts or agent-tools.ts is stale - run 'python -m agent_eval.prompt --emit-ts' and 'python -m agent_eval.tools --emit-ts' from api/src and commit. Until then the served route and the eval harness run different agents.";
            exit 1;
          }
      - name: Committed eval results match the current prompt
        working-directory: api/src
        run: |
          # The results file records the fingerprint it was produced under.
          # A prompt or tool-definition edit moves the fingerprint, so results
          # from before the edit no longer describe the current agent. This is
          # the same generate-and-diff shape as the types.ts check, applied to
          # an artifact CI cannot regenerate itself.
          python - <<'PY'
          import json, sys
          from pathlib import Path
          from agent_eval.prompt import fingerprint
          results = Path("../data/agent_eval/results.json")
          if not results.exists():
              sys.exit("::error::api/data/agent_eval/results.json is missing - run "
                       "`python -m agent_eval.runner --all` and commit the results.")
          recorded = json.loads(results.read_text())["prompt_fingerprint"]
          current = fingerprint()
          if recorded != current:
              sys.exit(f"::error::eval results are STALE: recorded fingerprint {recorded}, "
                       f"current {current}. The prompt or tool definitions changed since the "
                       "last paid run. Re-run `python -m agent_eval.runner --all` and commit "
                       "api/data/agent_eval/results.json.")
          print(f"eval results match fingerprint {current}")
          PY

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      # The build is the only check that exercises the App Router's own
      # type generation and the server/client component boundary - tsc
      # alone will happily typecheck a client component that imports a
      # server-only module. Env vars are placeholders: every page is
      # force-dynamic, so nothing is prerendered and nothing connects.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
