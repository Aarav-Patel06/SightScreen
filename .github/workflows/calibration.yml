name: Calibration monitor

# SPEC.md §2.3's schedule: daily 03:00 UTC. §8.1's steps 1-4 always run and
# always have value; steps 5-8 usually decline to act. A green run that
# changes nothing is this job succeeding, and its log says so in words.
#
# workflow_dispatch as well as the schedule, deliberately. A scheduled job
# whose first real execution is unattended at 3am is a job nobody has
# actually tested - Phase 2 spent four sessions learning that things which
# look correct are frequently wrong about reality.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    continue-on-error: true  # see the report job below
    outputs:
      ok: ${{ steps.done.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install api package
        run: pip install -e "./api[dev]"
      - name: Run the calibration monitor
        working-directory: api/src
        env:
          # The prediction log lives in Supabase. This is the only credential
          # the job needs: it reads `predictions` joined to
          # `prediction_outcomes` and writes one `calibration_runs` row, and
          # it never touches the local corpus - which does not exist on a
          # runner and never will (§2.1).
          #
          # Scoped to this step rather than the job, matching ci.yml's
          # treatment of SUPABASE_ACCESS_TOKEN.
          SUPABASE_SESSION_POOLER_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          # An OVERRIDE, not the source. The published baselines URL is
          # committed in api/data/baselines_published.json, so the checkout
          # already has it and this secret does not need to exist - when it
          # is unset GitHub substitutes an empty string, which env_value
          # treats as absent, and the committed record is used. Set it only
          # to point a run at different bytes without a commit.
          #
          # The baselines are fitted objects (a scaler plus coefficients, and
          # three lookup tables) trained on the corpus, which a runner does
          # not have - hence an artifact rather than a refit here. The digest
          # is verified on download before anything is scored.
          BASELINES_ARTIFACT_URL: ${{ secrets.BASELINES_ARTIFACT_URL }}
        run: python -u -m eval.calibration_monitor --out "$RUNNER_TEMP/calibration.json"
      - name: Keep the report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-report
          path: ${{ runner.temp }}/calibration.json
          if-no-files-found: warn
      - name: Every step succeeded
        id: done
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

  # Only push-triggered CI may gate a deploy (SPEC.md section 15, 2026-09-28).
  # This scheduled/dispatched run attaches to main's head as a check suite, and
  # Railway's "Wait for CI" skips a commit with a failed one - so the work job
  # is continue-on-error (the run concludes success) and a failure is reported
  # as an "[ops]" issue instead. The steps themselves still stop at the first
  # failure: `ok` is set only by the last one.
  report:
    needs: monitor
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Open or close the ops issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ops_alert.py --title "Calibration monitor is failing"
          --failing ${{ needs.monitor.outputs.ok != 'true' }}
          --details "A step failed or did not finish; the run has the log."
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
