<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SightScreen">
  <!--
    THE SIMPLIFIED MARK (UI-PHASE-2 4.1): the ball alone, drawn for 16px.

    The full mark is a batsman, a bar chart, a ball and a circle inside a
    disc - roughly 8px per shape at a 32px favicon and under 4px at 16px, so
    scaling it down yields a smudge with a red dot in it.

    The ball rather than an "S": at 16px all that survives is an outline and
    one interior line, and a red disc with a seam is a cricket ball to anyone
    who has seen one. A two-colour "S" at that size is a smudge with a kink.

    THE SEAM IS TILTED, AND THAT WAS MEASURED RATHER THAN CHOSEN. Four
    variants were rendered at 16px and compared at true size: a near-vertical
    seam at the edge (the first attempt) reads as a nick out of the disc, and
    a centred vertical seam reads as the ball being split in half. Only the
    tilted arc reads as a seam wrapping a sphere, because it keeps ball on
    both sides of the line and crosses enough pixels to survive antialiasing.

    Geometry is emitted as an explicit polyline rather than an SVG arc so it
    is provably identical to app/icon.png and app/apple-icon.png, which are
    rasterised from the same parametric curve.

    Colours are sampled from public/logo.png, NOT from the CSS tokens: a brand
    mark should match the artwork it comes from rather than drift with the
    interface palette.
  -->
  <circle cx="16" cy="16" r="15" fill="#98374B"/>
  <path d="M 23.04 2.76 L 22.81 2.67 L 22.55 2.64 L 22.26 2.67 L 21.95 2.75 L 21.60 2.89 L 21.24 3.09 L 20.85 3.34 L 20.44 3.65 L 20.02 4.01 L 19.57 4.42 L 19.11 4.88 L 18.64 5.39 L 18.15 5.94 L 17.66 6.54 L 17.16 7.18 L 16.65 7.85 L 16.15 8.56 L 15.64 9.31 L 15.13 10.08 L 14.62 10.87 L 14.13 11.69 L 13.64 12.53 L 13.16 13.38 L 12.69 14.24 L 12.24 15.11 L 11.80 15.98 L 11.38 16.86 L 10.98 17.73 L 10.60 18.59 L 10.25 19.44 L 9.92 20.28 L 9.61 21.10 L 9.33 21.89 L 9.09 22.67 L 8.87 23.41 L 8.68 24.12 L 8.52 24.80 L 8.40 25.44 L 8.31 26.03 L 8.25 26.59 L 8.22 27.10 L 8.23 27.56 L 8.27 27.98 L 8.34 28.34 L 8.45 28.65 L 8.59 28.90 L 8.76 29.10 L 8.96 29.24" fill="none" stroke="#F7F6E9" stroke-width="3.0" stroke-linecap="round"/>
</svg>
